<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply - Run a Grocery Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #0f1a14;
      --bg-2: #13241b;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text: #eef6f0;
      --muted: #9fb5a7;
      --accent: #4ade80;
      --accent-2: #22c55e;
      --glow: rgba(74, 222, 128, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: -1;
      animation: float 18s ease-in-out infinite;
    }
    .blob-1 { width: 420px; height: 420px; background: var(--accent-2); top: -120px; left: -120px; }
    .blob-2 { width: 360px; height: 360px; background: #0ea5e9; bottom: -100px; right: -100px; animation-delay: -6s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.1); }
    }

    .wrap {
      width: 100%;
      max-width: 640px;
      text-align: center;
      animation: fadeUp 0.8s ease both;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--glass);
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(90deg, #fff, var(--accent), #fff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s linear infinite;
    }
    .sub {
      color: var(--muted);
      margin: 0 0 32px;
      font-size: 1.05rem;
    }

    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 32px 28px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }

    /* Redirect notice (shown when auto-redirecting) */
    .redirect-msg {
      margin: 0 0 18px;
      color: var(--muted);
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 4px solid var(--glass-border);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .options {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }
    .option {
      display: block;
      text-decoration: none;
      color: var(--text);
      padding: 24px 18px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--glass-border);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .option:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--accent);
      box-shadow: 0 12px 40px var(--glow);
    }
    .option .icon { font-size: 2rem; margin-bottom: 8px; }
    .option h3 { margin: 0 0 6px; font-size: 1.2rem; }
    .option p { margin: 0; color: var(--muted); font-size: 0.9rem; }

    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      color: #0f1a14;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 24px var(--glow);
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }

    .hidden { display: none !important; }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }

    @media (max-width: 520px) {
      .options { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="wrap">
    <span class="badge">Applications Open</span>
    <h1>Apply Now</h1>

    <!-- ====== SET YOUR GOOGLE FORM LINKS HERE ====== -->
    <script>
      const FORMS = {
        npc: "https://docs.google.com/forms/d/e/1FAIpQLSdUzTiIVYTMiQximj1ec1F76wAyhReJXUGhNW6y-sE6BK_upw/viewform?usp=header",
        streamer: "https://docs.google.com/forms/d/e/1FAIpQLSdUzTiIVYTMiQximj1ec1F76wAyhReJXUGhNW6y-sE6BK_upw/viewform?usp=header"
      };
    </script>
    <!-- ============================================ -->

    <div class="card">
      <!-- Redirect view: shown when the link has ?role=npc or ?role=streamer -->
      <div id="redirectView" class="hidden">
        <div class="spinner"></div>
        <p class="redirect-msg">Dinadala ka na sa application form...</p>
        <a id="manualLink" class="btn" href="#">Hindi nag-redirect? I-click dito</a>
      </div>

      <!-- Chooser view: shown when there is no ?role= in the link -->
      <div id="chooserView" class="hidden">
        <p class="redirect-msg">Piliin ang gusto mong i-apply:</p>
        <div class="options">
          <a class="option" href="?role=npc">
            <div class="icon">🧑‍🤝‍🧑</div>
            <h3>NPC</h3>
            <p>Mag-apply bilang NPC sa game.</p>
          </a>
          <a class="option" href="?role=streamer">
            <div class="icon">🎥</div>
            <h3>Streamer</h3>
            <p>Mag-apply bilang streamer.</p>
          </a>
        </div>
      </div>
    </div>

    <footer>Run a Grocery Store &middot; Staff Applications</footer>
  </div>

  <script>
    const role = new URLSearchParams(window.location.search).get("role");
    const redirectView = document.getElementById("redirectView");
    const chooserView = document.getElementById("chooserView");
    const manualLink = document.getElementById("manualLink");

    if (role && FORMS[role]) {
      // Auto-send to the matching Google Form
      redirectView.classList.remove("hidden");
      manualLink.href = FORMS[role];
      setTimeout(() => { window.location.replace(FORMS[role]); }, 800);
    } else {
      chooserView.classList.remove("hidden");
    }
  </script>

</body>
</html>
